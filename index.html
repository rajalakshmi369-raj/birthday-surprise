<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Birthday Surprise 🎂💖</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ff758c,
                    #ff7eb3,
                    #6a5acd
                );

            display: flex;

            justify-content: center;

            align-items: center;

            color: white;

            padding: 20px;

        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .container {

            width: 100%;

            max-width: 560px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

            padding: 30px;

            border-radius: 25px;

            box-shadow:
                0 10px 40px
                rgba(
                    0,
                    0,
                    0,
                    0.3
                );

            text-align: center;

            backdrop-filter:
                blur(10px);

        }


        h1 {

            font-size: 36px;

            margin-top: 0;

            margin-bottom: 25px;

        }


        label {

            display: block;

            text-align: left;

            margin-top: 17px;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 15px;

        }


        input,
        textarea {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

        }


        textarea {

            height: 110px;

            resize: none;

        }


        input[type="file"] {

            background: white;

            color: #555;

            cursor: pointer;

        }


        /* =========================
           PHOTO PREVIEW
        ========================== */

        #photoPreview {

            display: none;

            width: 160px;

            height: 160px;

            object-fit: cover;

            border-radius: 50%;

            margin: 18px auto;

            border:
                5px solid white;

            box-shadow:
                0 8px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

        }


        .photoHint {

            font-size: 13px;

            opacity: 0.8;

            margin-top: 5px;

        }


        /* =========================
           BUTTONS
        ========================== */

        button {

            margin-top: 20px;

            padding:
                14px
                30px;

            border: none;

            border-radius: 30px;

            background: white;

            color: #ff4f81;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.25s ease;

        }


        button:hover {

            transform:
                scale(1.05);

        }


        #testButton {

            background:
                #ffe066;

            color:
                #7a4e00;

        }


        /* =========================
           SAVED DETAILS
        ========================== */

        #savedDetails {

            display: none;

            margin-top: 25px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            padding: 20px;

            border-radius: 18px;

        }


        #savedPhoto {

            display: none;

            width: 120px;

            height: 120px;

            object-fit: cover;

            border-radius: 50%;

            border:
                4px solid white;

            margin:
                5px auto 15px;

        }


        /* =========================
           BIRTHDAY POPUP
        ========================== */

        #birthdayPopup {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.88
                );

            z-index: 9999;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 20px;

        }


        .popupContent {

            width: 95%;

            max-width: 680px;

            max-height: 90vh;

            overflow-y: auto;

            padding: 40px 25px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #ff758c,
                    #ff7eb3,
                    #845ec2
                );

            box-shadow:
                0 0 60px
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

            animation:
                popupAnimation
                0.8s ease;

        }


        /* =========================
           POPUP PHOTO
        ========================== */

        #popupPhoto {

            display: none;

            width: 230px;

            height: 230px;

            object-fit: cover;

            border-radius: 50%;

            border:
                7px solid white;

            margin:
                15px auto 20px;

            box-shadow:
                0 10px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

            animation:
                photoAnimation
                1s ease;

        }


        .cake {

            font-size: 85px;

            animation:
                cakeBounce
                1s infinite
                alternate;

        }


        .popupContent h2 {

            font-size: 48px;

            margin:
                10px 0;

        }


        .popupContent h3 {

            font-size: 34px;

            margin:
                15px 0;

        }


        #popupMessage {

            font-size: 20px;

            line-height: 1.7;

            white-space: pre-line;

        }


        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes popupAnimation {

            from {

                transform:
                    scale(0.3);

                opacity: 0;

            }

            to {

                transform:
                    scale(1);

                opacity: 1;

            }

        }


        @keyframes photoAnimation {

            from {

                transform:
                    scale(0);

                opacity: 0;

            }

            to {

                transform:
                    scale(1);

                opacity: 1;

            }

        }


        @keyframes cakeBounce {

            from {

                transform:
                    translateY(0);

            }

            to {

                transform:
                    translateY(-12px);

            }

        }


        /* =========================
           CONFETTI
        ========================== */

        .confetti {

            position: fixed;

            top: -30px;

            z-index: 10000;

            font-size: 25px;

            pointer-events: none;

            animation:
                confettiFall
                4s linear
                forwards;

        }


        @keyframes confettiFall {

            from {

                transform:
                    translateY(0)
                    rotate(0deg);

            }

            to {

                transform:
                    translateY(110vh)
                    rotate(720deg);

            }

        }


        /* =========================
           MOBILE
        ========================== */

        @media (
            max-width: 600px
        ) {

            .container {

                padding: 22px;

            }


            h1 {

                font-size: 29px;

            }


            .popupContent {

                padding:
                    30px 18px;

            }


            .popupContent h2 {

                font-size: 34px;

            }


            .popupContent h3 {

                font-size: 27px;

            }


            #popupMessage {

                font-size: 17px;

            }


            #popupPhoto {

                width: 180px;

                height: 180px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         MAIN PAGE
    ========================== -->

    <div class="container">


        <h1>
            🎂 Birthday Surprise 💖
        </h1>


        <!-- NAME -->

        <label>
            👤 Person Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter birthday person's name"
        >


        <!-- DOB -->

        <label>
            🎂 Date of Birth
        </label>

        <input
            type="date"
            id="dob"
        >


        <!-- TIME -->

        <label>
            ⏰ Wish Time
        </label>

        <input
            type="time"
            id="wishTime"
            value="00:00"
        >


        <!-- PHOTO -->

        <label>
            📸 Birthday Person's Photo
        </label>

        <input
            type="file"
            id="photo"
            accept="image/*"
            onchange="previewPhoto()"
        >

        <p class="photoHint">
            Choose your bestie's photo 💕
        </p>


        <!-- PHOTO PREVIEW -->

        <img
            id="photoPreview"
            alt="Photo Preview"
        >


        <!-- WISH -->

        <label>
            💌 Birthday Wish
        </label>

        <textarea
            id="wish"
            placeholder="Write your birthday wish here..."
        ></textarea>


        <!-- MUSIC -->

        <label>
            🎵 Birthday Music
        </label>

        <input
            type="file"
            id="music"
            accept="audio/*"
        >


        <!-- SAVE BUTTON -->

        <button
            onclick="saveBirthday()"
        >
            💾 SAVE BIRTHDAY
        </button>


        <br>


        <!-- TEST BUTTON -->

        <button
            id="testButton"
            onclick="testBirthday()"
        >
            🧪 TEST SURPRISE
        </button>


        <!-- SAVED DETAILS -->

        <div
            id="savedDetails"
        >

            <h2>
                💖 Birthday Saved!
            </h2>


            <img
                id="savedPhoto"
                alt="Saved Birthday Photo"
            >


            <p
                id="savedName"
            ></p>


            <p
                id="savedDOB"
            ></p>


            <p
                id="savedTime"
            ></p>


            <p>
                🔔 The page will check the birthday automatically.
            </p>

        </div>


    </div>


    <!-- =========================
         BIRTHDAY POPUP
    ========================== -->

    <div
        id="birthdayPopup"
    >

        <div
            class="popupContent"
        >


            <div class="cake">
                🎂
            </div>


            <h2>
                🎉 HAPPY BIRTHDAY 🎉
            </h2>


            <!-- PERSON PHOTO -->

            <img
                id="popupPhoto"
                alt="Birthday Person"
            >


            <!-- PERSON NAME -->

            <h3
                id="popupName"
            >
            </h3>


            <!-- WISH -->

            <p
                id="popupMessage"
            >
            </p>


            <!-- CLOSE -->

            <button
                onclick="closeBirthday()"
            >
                ❤️ Close Surprise
            </button>


        </div>

    </div>


    <!-- =========================
         AUDIO
    ========================== -->

    <audio
        id="birthdayMusic"
        loop
    ></audio>


    <script>


        /* =====================================
           LOAD SAVED BIRTHDAY DATA
        ====================================== */

        let savedBirthday = null;


        try {

            savedBirthday =
                JSON.parse(
                    localStorage.getItem(
                        "birthdayData"
                    )
                );

        }

        catch (error) {

            savedBirthday = null;

        }


        /* =====================================
           PHOTO PREVIEW
        ====================================== */

        function previewPhoto() {


            const photoFile =
                document
                    .getElementById(
                        "photo"
                    )
                    .files[0];


            const preview =
                document.getElementById(
                    "photoPreview"
                );


            if (!photoFile) {

                preview.style.display =
                    "none";

                return;

            }


            /* CHECK IMAGE */

            if (
                !photoFile.type
                    .startsWith(
                        "image/"
                    )
            ) {

                alert(
                    "Please select an image file."
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    preview.src =
                        event.target.result;

                    preview.style.display =
                        "block";

                };


            reader.readAsDataURL(
                photoFile
            );

        }


        /* =====================================
           SAVE BIRTHDAY
        ====================================== */

        function saveBirthday() {


            const name =
                document
                    .getElementById(
                        "name"
                    )
                    .value
                    .trim();


            const dob =
                document
                    .getElementById(
                        "dob"
                    )
                    .value;


            const wishTime =
                document
                    .getElementById(
                        "wishTime"
                    )
                    .value;


            const wish =
                document
                    .getElementById(
                        "wish"
                    )
                    .value
                    .trim();


            const photoFile =
                document
                    .getElementById(
                        "photo"
                    )
                    .files[0];


            const musicFile =
                document
                    .getElementById(
                        "music"
                    )
                    .files[0];


            /* REQUIRED FIELDS */

            if (
                !name ||
                !dob ||
                !wishTime
            ) {

                alert(
                    "Please enter Name, Date of Birth and Wish Time."
                );

                return;

            }


            /* =========================
               PHOTO READER
            ========================== */

            if (photoFile) {


                const photoReader =
                    new FileReader();


                photoReader.onload =
                    function(event) {


                        const photoData =
                            event.target.result;


                        saveMusic(
                            name,
                            dob,
                            wishTime,
                            wish,
                            photoData,
                            musicFile
                        );

                    };


                photoReader.readAsDataURL(
                    photoFile
                );

            }

            else {


                /* KEEP OLD PHOTO */

                const oldPhoto =
                    savedBirthday &&
                    savedBirthday.photo
                        ? savedBirthday.photo
                        : "";


                saveMusic(
                    name,
                    dob,
                    wishTime,
                    wish,
                    oldPhoto,
                    musicFile
                );

            }

        }


        /* =====================================
           SAVE MUSIC
        ====================================== */

        function saveMusic(
            name,
            dob,
            wishTime,
            wish,
            photo,
            musicFile
        ) {


            if (musicFile) {


                const musicReader =
                    new FileReader();


                musicReader.onload =
                    function(event) {


                        saveData(
                            name,
                            dob,
                            wishTime,
                            wish,
                            photo,
                            event.target.result
                        );

                    };


                musicReader.readAsDataURL(
                    musicFile
                );

            }

            else {


                /* KEEP OLD MUSIC */

                const oldMusic =
                    savedBirthday &&
                    savedBirthday.music
                        ? savedBirthday.music
                        : "";


                saveData(
                    name,
                    dob,
                    wishTime,
                    wish,
                    photo,
                    oldMusic
                );

            }

        }


        /* =====================================
           SAVE DATA
        ====================================== */

        function saveData(
            name,
            dob,
            wishTime,
            wish,
            photo,
            music
        ) {


            const data = {

                name:
                    name,

                dob:
                    dob,

                wishTime:
                    wishTime,

                wish:
                    wish,

                photo:
                    photo,

                music:
                    music,

                lastAlertDate:
                    ""

            };


            try {


                localStorage.setItem(
                    "birthdayData",
                    JSON.stringify(
                        data
                    )
                );


            }

            catch (error) {


                console.error(
                    error
                );


                alert(
                    "⚠️ Photo or music file is too large. Please select a smaller file."
                );


                return;

            }


            savedBirthday =
                data;


            showSavedDetails();


            alert(
                "🎂 Birthday saved successfully! 💖"
            );

        }


        /* =====================================
           SHOW SAVED DETAILS
        ====================================== */

        function showSavedDetails() {


            if (!savedBirthday) {

                return;

            }


            document
                .getElementById(
                    "savedDetails"
                )
                .style.display =
                "block";


            document
                .getElementById(
                    "savedName"
                )
                .innerHTML =

                "👤 Name: " +
                savedBirthday.name;


            document
                .getElementById(
                    "savedDOB"
                )
                .innerHTML =

                "🎂 Date: " +
                savedBirthday.dob;


            document
                .getElementById(
                    "savedTime"
                )
                .innerHTML =

                "⏰ Wish Time: " +
                savedBirthday.wishTime;


            const savedPhoto =
                document.getElementById(
                    "savedPhoto"
                );


            if (
                savedBirthday.photo
            ) {


                savedPhoto.src =
                    savedBirthday.photo;


                savedPhoto.style.display =
                    "block";

            }

            else {


                savedPhoto.style.display =
                    "none";

            }

        }


        /* =====================================
           TEST SURPRISE
        ====================================== */

        function testBirthday() {


            if (!savedBirthday) {


                alert(
                    "First enter the birthday details and click SAVE BIRTHDAY."
                );


                return;

            }


            showBirthday();

        }


        /* =====================================
           CHECK REAL BIRTHDAY
        ====================================== */

        function checkBirthday() {


            if (!savedBirthday) {

                return;

            }


            const now =
                new Date();


            /* CURRENT MONTH */

            const currentMonth =
                String(
                    now.getMonth() + 1
                )
                .padStart(
                    2,
                    "0"
                );


            /* CURRENT DAY */

            const currentDay =
                String(
                    now.getDate()
                )
                .padStart(
                    2,
                    "0"
                );


            /* CURRENT YEAR */

            const currentYear =
                now.getFullYear();


            /* CURRENT TIME */

            const currentTime =

                String(
                    now.getHours()
                )
                .padStart(
                    2,
                    "0"
                )

                +

                ":"

                +

                String(
                    now.getMinutes()
                )
                .padStart(
                    2,
                    "0"
                );


            /* DOB */

            const dobParts =
                savedBirthday.dob
                    .split("-");


            const birthMonth =
                dobParts[1];


            const birthDay =
                dobParts[2];


            /* TODAY */

            const today =

                currentYear
                +
                "-"
                +
                currentMonth
                +
                "-"
                +
                currentDay;


            /* BIRTHDAY? */

            const isBirthday =

                currentMonth ===
                    birthMonth

                &&

                currentDay ===
                    birthDay;


            /* CORRECT TIME? */

            const correctTime =

                currentTime ===
                savedBirthday.wishTime;


            /* ALREADY SHOWN? */

            const alreadyAlerted =

                savedBirthday
                    .lastAlertDate
                ===
                today;


            if (

                isBirthday

                &&

                correctTime

                &&

                !alreadyAlerted

            ) {


                savedBirthday
                    .lastAlertDate =
                    today;


                localStorage.setItem(
                    "birthdayData",
                    JSON.stringify(
                        savedBirthday
                    )
                );


                showBirthday();

            }

        }


        /* =====================================
           SHOW BIRTHDAY
        ====================================== */

        function showBirthday() {


            if (!savedBirthday) {

                return;

            }


            /* POPUP */

            document
                .getElementById(
                    "birthdayPopup"
                )
                .style.display =
                "flex";


            /* NAME */

            document
                .getElementById(
                    "popupName"
                )
                .innerHTML =

                savedBirthday.name
                +
                " ❤️";


            /* MESSAGE */

            document
                .getElementById(
                    "popupMessage"
                )
                .innerHTML =

                savedBirthday.wish

                ||

                "Wishing you a beautiful birthday filled with happiness, love and wonderful memories! 🎂❤️✨";


            /* PHOTO */

            const popupPhoto =
                document.getElementById(
                    "popupPhoto"
                );


            if (
                savedBirthday.photo
            ) {


                popupPhoto.src =
                    savedBirthday.photo;


                popupPhoto.style.display =
                    "block";

            }

            else {


                popupPhoto.style.display =
                    "none";

            }


            /* MUSIC */

            playMusic();


            /* CONFETTI */

            createConfetti();


            /* NOTIFICATION */

            sendNotification();

        }


        /* =====================================
           PLAY MUSIC
        ====================================== */

        function playMusic() {


            const audio =
                document.getElementById(
                    "birthdayMusic"
                );


            if (
                savedBirthday &&
                savedBirthday.music
            ) {


                audio.src =
                    savedBirthday.music;


                audio.play()
                    .catch(
                        function(error) {

                            console.log(
                                "Browser blocked autoplay:",
                                error
                            );

                        }
                    );

            }

        }


        /* =====================================
           NOTIFICATION
        ====================================== */

        function sendNotification() {


            if (
                !(
                    "Notification"
                    in window
                )
            ) {

                return;

            }


            if (
                Notification.permission
                ===
                "granted"
            ) {


                new Notification(

                    "🎉 HAPPY BIRTHDAY!",

                    {

                        body:

                            "It's " +
                            savedBirthday.name +
                            "'s birthday! 🎂❤️"

                    }

                );

            }


            else if (

                Notification.permission
                !==
                "denied"

            ) {


                Notification
                    .requestPermission();

            }

        }


        /* =====================================
           CONFETTI
        ====================================== */

        function createConfetti() {


            const emojis = [

                "🎉",
                "🎊",
                "❤️",
                "✨",
                "🎂",
                "🥳",
                "💖",
                "⭐",
                "🌸",
                "💕",
                "🦋",
                "💐"

            ];


            for (
                let i = 0;
                i < 120;
                i++
            ) {


                const confetti =
                    document.createElement(
                        "div"
                    );


                confetti
                    .className =
                    "confetti";


                confetti.innerHTML =

                    emojis[
                        Math.floor(
                            Math.random()
                            *
                            emojis.length
                        )
                    ];


                confetti.style.left =

                    Math.random()
                    *
                    100
                    +
                    "vw";


                confetti.style.animationDuration =

                    (
                        2
                        +
                        Math.random()
                        *
                        4
                    )
                    +
                    "s";


                confetti.style.animationDelay =

                    Math.random()
                    *
                    2
                    +
                    "s";


                document.body
                    .appendChild(
                        confetti
                    );


                setTimeout(

                    function() {

                        confetti.remove();

                    },

                    7000

                );

            }

        }


        /* =====================================
           CLOSE BIRTHDAY
        ====================================== */

        function closeBirthday() {


            document
                .getElementById(
                    "birthdayPopup"
                )
                .style.display =
                "none";


            const audio =
                document.getElementById(
                    "birthdayMusic"
                );


            audio.pause();


            audio.currentTime =
                0;

        }


        /* =====================================
           LOAD SAVED DATA
        ====================================== */

        if (
            savedBirthday
        ) {


            document
                .getElementById(
                    "name"
                )
                .value =
                savedBirthday.name
                || "";


            document
                .getElementById(
                    "dob"
                )
                .value =
                savedBirthday.dob
                || "";


            document
                .getElementById(
                    "wishTime"
                )
                .value =
                savedBirthday.wishTime
                || "00:00";


            document
                .getElementById(
                    "wish"
                )
                .value =
                savedBirthday.wish
                || "";


            /* LOAD PHOTO */

            if (
                savedBirthday.photo
            ) {


                const preview =
                    document.getElementById(
                        "photoPreview"
                    );


                preview.src =
                    savedBirthday.photo;


                preview.style.display =
                    "block";

            }


            showSavedDetails();

        }


        /* =====================================
           CHECK EVERY SECOND
        ====================================== */

        setInterval(

            checkBirthday,

            1000

        );


    </script>


</body>

</html>
